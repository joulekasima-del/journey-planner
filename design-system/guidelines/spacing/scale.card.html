<!-- @dsCard group="Spacing" viewport="700x160" subtitle="4px base scale, 8/14/24 radius scale" name="Spacing & Radius Scale" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-mono);font-size:11px;background:var(--surface-card);padding:20px;box-sizing:border-box;color:var(--text-secondary)}
.row{display:flex;align-items:flex-end;gap:8px;margin-bottom:16px}
.blk{background:var(--canopy-green);height:24px}
.rgrid{display:flex;gap:16px;align-items:center}
.r{background:var(--pond-teal);width:56px;height:56px;display:flex;align-items:center;justify-content:center;color:var(--forest-shade)}
</style></head><body>
<div class="row">
<div class="blk" style="width:4px"></div><div class="blk" style="width:8px"></div><div class="blk" style="width:12px"></div><div class="blk" style="width:16px"></div><div class="blk" style="width:24px"></div><div class="blk" style="width:32px"></div><div class="blk" style="width:48px"></div><div class="blk" style="width:64px"></div>
</div>
<div class="rgrid">
<div class="r" style="border-radius:8px">sm</div>
<div class="r" style="border-radius:14px">md</div>
<div class="r" style="border-radius:24px">lg</div>
<div class="r" style="border-radius:999px">pill</div>
</div>
</body></html>
