<!-- @dsCard group="Colors" viewport="700x300" subtitle="Locked JP-026. Each meets WCAG AA; pair with icon/shape, never color alone" name="Semantic Roles" -->
<html><head><link rel="stylesheet" href="../../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:var(--surface-card);padding:16px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.role{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}
.sw{padding:12px 14px}
.name{font:600 13px var(--font-body)}
.hex{font:var(--text-mono-sm);opacity:.85;margin-top:2px}
</style></head><body>
<div class="grid">
<div class="role"><div class="sw" style="background:var(--semantic-verified-base);color:#fff"><div class="name">Verified</div><div class="hex">#3568E0</div></div></div>
<div class="role"><div class="sw" style="background:var(--semantic-attention-base);color:#fff"><div class="name">Attention</div><div class="hex">#B4630F</div></div></div>
<div class="role"><div class="sw" style="background:var(--semantic-critical-base);color:#fff"><div class="name">Critical</div><div class="hex">#C93C30</div></div></div>
<div class="role"><div class="sw" style="background:var(--semantic-proposal-base);color:#fff"><div class="name">In Progress</div><div class="hex">#7C4DDC</div></div></div>
<div class="role"><div class="sw" style="background:var(--semantic-neutral-base);color:#fff"><div class="name">Neutral</div><div class="hex">#647082</div></div></div>
<div class="role"><div class="sw" style="background:var(--semantic-focus-ring);color:#fff"><div class="name">Focus / Selected</div><div class="hex">#3568E0 (ring only)</div></div></div>
</div>
</body></html>
