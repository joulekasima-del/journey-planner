<!-- @dsCard group="Colors" viewport="700x180" subtitle="Wired to the approved semantic layer — separate from illustrated-map color per JP-022" name="Semantic Status" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:var(--surface-card);padding:16px;box-sizing:border-box}
.row{display:flex;gap:10px}
.chip{flex:1;border-radius:var(--radius-md);padding:14px;font:var(--text-label)}
.note{margin-top:10px;font:var(--text-caption);color:var(--text-tertiary)}
</style></head><body>
<div class="row">
<div class="chip" style="background:var(--status-success-bg);color:var(--status-success-text)">Verified · Ready</div>
<div class="chip" style="background:var(--status-info-bg);color:var(--status-info-text)">In Progress · Calculating</div>
<div class="chip" style="background:var(--status-attention-bg);color:var(--status-attention-text)">Attention · Needs Booking</div>
<div class="chip" style="background:var(--status-danger-bg);color:var(--status-danger-text)">Critical · Failed</div>
</div>
<div class="note">Approved semantic layer — Verified Blue, Proposal Violet, Beacon Amber, Critical Red. Distinct from the JP-022 illustrated palette.</div>
</body></html>
