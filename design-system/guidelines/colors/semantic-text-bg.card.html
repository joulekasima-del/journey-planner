<html><head><link rel="stylesheet" href="../../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:var(--surface-card);padding:16px;box-sizing:border-box;display:flex;gap:10px;flex-wrap:wrap}
.pill{border-radius:var(--radius-pill);padding:10px 16px;font:600 13px var(--font-body)}

<div class="pill" style="background:var(--semantic-verified-bg);color:var(--semantic-verified-text)">Verified · #1E4FC2 on #E2EAFB</div>
<div class="pill" style="background:var(--semantic-attention-bg);color:var(--semantic-attention-text)">Attention · #8A4B0B on #F6E9DA</div>
<div class="pill" style="background:var(--semantic-critical-bg);color:var(--semantic-critical-text)">Critical · #A32B22 on #F8E2DF</div>
<div class="pill" style="background:var(--semantic-proposal-bg);color:var(--semantic-proposal-text)">In Progress · #5B2FAE on #EDE6FA</div>
<div class="pill" style="background:var(--semantic-neutral-bg);color:var(--semantic-neutral-text)">Neutral · #454E58 on #E7E9EC</div>
