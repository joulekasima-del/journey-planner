<!-- @dsCard group="Brand" viewport="700x150" subtitle="Every state pairs text with icon/shape/border — color never carries meaning alone (JP research 7)" name="State Principle" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:var(--surface-card);padding:20px;box-sizing:border-box;display:flex;gap:12px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-pill);font:var(--text-label)}
.dot{width:8px;height:8px;border-radius:50%}
</style></head><body>
<div class="pill" style="background:var(--status-success-bg);color:var(--status-success-text);border:1px solid var(--status-success)"><span class="dot" style="background:var(--status-success)"></span>Ready</div>
<div class="pill" style="background:var(--status-attention-bg);color:var(--status-attention-text);border:1.5px dashed var(--status-attention-text)"><span class="dot" style="background:var(--status-attention)"></span>Needs Attention</div>
<div class="pill" style="background:var(--status-neutral-bg);color:var(--status-neutral-text);border:1px solid var(--border-hairline)"><span class="dot" style="background:var(--status-neutral)"></span>Exploring</div>
</body></html>
