<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="omelette-print-source" content="v1786895149807197 components/feedback/feedback.card.html">
<link rel="stylesheet" href="../../styles.css">
<style>doc-page:not(:defined){visibility:hidden}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
*{animation-delay:-99s!important;animation-duration:.001s!important;animation-iteration-count:1!important;animation-fill-mode:both!important;animation-play-state:running!important;transition-duration:0s!important}
body{margin:0}
.row{display:flex;gap:12px;margin-top:16px}
.action-card{background:var(--surface-card);border-radius:var(--radius-md);border:1px solid var(--status-attention);border-left:4px solid var(--status-attention);padding:16px 18px;font-family:var(--font-body);display:flex;flex-direction:column;gap:8px;max-width:380px}
.action-title{font:var(--text-heading-sm);color:var(--text-primary);display:flex;align-items:center;gap:8px}
.action-why{font:var(--text-body-sm);color:var(--text-secondary)}
.action-foot{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.action-status{font:var(--text-caption);color:var(--text-tertiary)}
.action-btn{border:none;background:var(--status-attention-bg);color:var(--status-attention-text);border-radius:var(--radius-pill);padding:7px 16px;font:var(--text-label)}
.toast{border-radius:var(--radius-md);padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-lg);font-family:var(--font-body);font:var(--text-body-sm);max-width:360px}
.toast-success{background:var(--status-success-text);color:var(--mist-white)}
.toast-danger{background:var(--status-danger-text);color:var(--mist-white)}
</style></head>
<body>
<doc-page margin="0.75in">
<div class="action-card">
<div class="action-title">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--status-attention)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5L20.5 19h-17z"/><path d="M12 10.3v3.6"/><circle cx="12" cy="16.6" r="0.9" fill="var(--status-attention)" stroke="none"/></svg>
Indigo weaving requires booking.
</div>
<div class="action-why">Journey Day 4 cannot become Ready until the host confirms.</div>
<div class="action-foot">
<span class="action-status">Waiting for provider — updated 12 minutes ago</span>
<button class="action-btn">Continue booking</button>
</div>
</div>
<div class="row">
<div class="toast toast-success">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--mist-white)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6"/></svg>
<span style="flex:1">Journey Day 4 saved</span>
</div>
<div class="toast toast-danger">
<span style="flex:1">Could not save — retry when back online</span>
</div>
</div>
</doc-page>
<script src="../../doc-page.js"></script>
</body></html>
