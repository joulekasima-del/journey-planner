<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explorer Proposal</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>
body{margin:0;background:var(--surface-sunken);font-family:var(--font-body);color:var(--text-primary)}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;padding:12px 16px;background:color-mix(in srgb,var(--surface-sunken) 90%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border-hairline)}
.flag{font:600 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--semantic-proposal-text);background:var(--semantic-proposal-bg);padding:6px 10px;border-radius:999px}
.stage{display:flex;justify-content:center;padding:24px 16px 48px}
.jp-press:focus-visible,.jp-map-node:focus-visible circle:last-of-type,button:focus-visible,select:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
h1,h2{text-wrap:balance}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="Discover.jsx"></script>
<script type="text/babel" src="Region.jsx"></script>
<script type="text/babel" src="Experience.jsx"></script>
<script type="text/babel" src="JourneyDay.jsx"></script>
<script type="text/babel" src="Compass.jsx"></script>
<script type="text/babel">
const { Tabs } = window.JPProductFoundationJourneyPlannerDesignSystem_e30f18;
function App(){
  const [screen,setScreen]=React.useState("discover");
  const [device,setDevice]=React.useState(window.innerWidth>1100?"desktop":"mobile");
  const [state,setState]=React.useState({segment:"slow",month:new Date().getMonth(),region:"isaan",exp:"indigo"});
  const scroller=React.useRef(null);
  const go=(s,patch)=>{ if(patch) setState(p=>({...p,...patch})); setScreen(s); if(scroller.current) scroller.current.scrollTop=0; window.scrollTo(0,0); };
  const desktop=device==="desktop" && screen!=="compass";
  const props={desktop,state,setState,go};
  const screens={discover:<window.Discover {...props}/>,region:<window.Region {...props}/>,experience:<window.Experience {...props}/>,day:<window.JourneyDay {...props}/>,compass:<window.Compass {...props}/>};
  return (<>
    <div className="bar">
      <span className="flag">Proposal · not locked</span>
      <Tabs tabs={[{value:"discover",label:"Discover"},{value:"region",label:"Region"},{value:"experience",label:"Experience"},{value:"day",label:"Journey Day"},{value:"compass",label:"Compass"}]} value={screen} onChange={(s)=>go(s)}/>
      <Tabs tabs={[{value:"mobile",label:"Mobile"},{value:"desktop",label:"Desktop"}]} value={device} onChange={setDevice}/>
    </div>
    <div className="stage">
      {desktop
        ? <main style={{width:1180,maxWidth:"100%",background:"var(--surface-page)",borderRadius:"var(--radius-lg)",boxShadow:"var(--shadow-md)",overflow:"hidden"}}>{screens[screen]}</main>
        : <div style={{width:390,maxWidth:"100%",borderRadius:40,border:"8px solid var(--forest-shade)",overflow:"hidden",background:"var(--surface-page)",boxShadow:"var(--shadow-lg)"}}>
            <div style={{display:"flex",justifyContent:"space-between",padding:"10px 20px 4px",font:"var(--text-mono-sm)"}}><span>9:41</span><span>Journey Planner</span></div>
            <main ref={scroller} style={{height:720,overflowY:"auto"}}>{screens[screen]}</main>
          </div>}
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
