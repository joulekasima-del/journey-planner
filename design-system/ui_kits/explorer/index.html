<!-- @dsCard group="Explorer App" viewport="460x820" subtitle="Click-through: Discovery, Journey Compass, Experience, Journeys, Journey Day" name="Explorer Kit" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-sunken);font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;padding:24px 0;box-sizing:border-box}
.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;justify-content:center;max-width:420px}
</style>
</head><body>
<div id="toolbar"></div>
<div id="root"></div>
<script type="text/babel" src="PhoneFrame.jsx"></script>
<script type="text/babel" src="DiscoveryLanding.jsx"></script>
<script type="text/babel" src="JourneyCompass.jsx"></script>
<script type="text/babel" src="ExperienceDetail.jsx"></script>
<script type="text/babel" src="JourneysList.jsx"></script>
<script type="text/babel" src="JourneyDay.jsx"></script>
<script type="text/babel">
const { Tabs } = window.JPProductFoundationJourneyPlannerDesignSystem_e30f18;
function App(){
  const [screen,setScreen]=React.useState("discovery");
  const [device,setDevice]=React.useState("mobile");
  const desktop = device==="desktop" && (screen==="list"||screen==="day");
  const screens = {
    discovery:<window.DiscoveryLanding onGuided={()=>setScreen("compass")} onOpenExperience={()=>setScreen("experience")}/>,
    compass:<window.JourneyCompass onFinish={()=>setScreen("experience")}/>,
    experience:<window.ExperienceDetail onBack={()=>setScreen("discovery")} onAdded={()=>setScreen("day")}/>,
    list:<window.JourneysList desktop={desktop} onOpenDay={()=>setScreen("day")}/>,
    day:<window.JourneyDay desktop={desktop}/>,
  };
  const content = screens[screen];
  return (<>
    <div className="toolbar">
      <Tabs tabs={[{value:"discovery",label:"Discovery"},{value:"compass",label:"Journey Compass"},{value:"experience",label:"Experience"},{value:"list",label:"Journeys"},{value:"day",label:"Journey Day"}]} value={screen} onChange={setScreen}/>
    </div>
    {(screen==="list"||screen==="day") &&
      <div className="toolbar">
        <Tabs tabs={[{value:"mobile",label:"Mobile"},{value:"desktop",label:"Desktop"}]} value={device} onChange={setDevice}/>
      </div>
    }
    {desktop
      ? <div style={{width:1180,maxWidth:"95vw",background:"var(--surface-page)",borderRadius:"var(--radius-lg)",boxShadow:"var(--shadow-md)",overflow:"hidden"}}>{content}</div>
      : <window.PhoneFrame>{content}</window.PhoneFrame>
    }
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
